# Build and publish to GitHub Releases when a version tag is pushed.
# Push a tag like v1.0 or v0.9 to trigger: git tag v1.0 && git push origin v1.0

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: netspeed-linux-amd64
            suffix: ''
            gui: false
          - goos: linux
            goarch: loong64
            artifact: netspeed-linux-loong64
            suffix: ''
            gui: false
          - goos: windows
            goarch: amd64
            artifact: netspeed-windows-amd64
            suffix: '.exe'
            gui: false
          - goos: windows
            goarch: amd64
            artifact: netspeed-windows-amd64-gui
            suffix: '.exe'
            gui: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "${{ matrix.gui }}" = "true" ]; then
            echo "Generating manifest resource for GUI build..."
            go run github.com/akavel/rsrc@latest -manifest gui/manifest.xml -o gui/rsrc.syso
            go build -trimpath -ldflags "-s -w -H windowsgui" -o ${{ matrix.artifact }}${{ matrix.suffix }} ./gui
            rm -f gui/rsrc.syso
          else
            go build -trimpath -ldflags "-s -w" -o ${{ matrix.artifact }}${{ matrix.suffix }} .
          fi

      - name: Install UPX
        if: matrix.goarch != 'loong64'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Compress with UPX
        if: matrix.goarch != 'loong64'
        run: upx --best --lzma ${{ matrix.artifact }}${{ matrix.suffix }}

      - name: Archive
        run: |
          zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
